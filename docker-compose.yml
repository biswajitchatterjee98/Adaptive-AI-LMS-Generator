services:
  postgres:
    image: postgres:16
    container_name: adaptive_ai_lms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptive_ai_lms
    ports:
      - "5433:5432"
    volumes:
      - adaptive_ai_lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptive_ai_lms"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  adaptive_ai_lms_pgdata:
